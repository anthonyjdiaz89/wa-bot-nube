services:
  - type: web
    name: wa-bot-persistencia
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node index.js
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: SELF_URL
        sync: false
